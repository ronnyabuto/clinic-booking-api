[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clinic-booking-api"
version = "0.1.0"
description = "Transactional clinic appointment booking API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.129,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<2.1",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.18,<2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.14.2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx2>=2.13,<3", "ruff>=0.15,<1"]

[tool.setuptools.packages.find]
include = ["clinic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires a dedicated PostgreSQL TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
