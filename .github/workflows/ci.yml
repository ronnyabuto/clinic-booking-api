name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests and database checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: clinic
          POSTGRES_PASSWORD: clinic
          POSTGRES_DB: clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinic -d clinic_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://clinic:clinic@127.0.0.1:5432/clinic_test
      TEST_DATABASE_URL: postgresql+psycopg://clinic:clinic@127.0.0.1:5432/clinic_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps .
          python -m pip check
      - name: Lint and format
        run: |
          ruff check clinic migrations tests
          ruff format --check clinic migrations tests
      - name: Migrate a fresh database
        run: alembic upgrade head
      - name: Run the full test suite
        run: pytest -q --junitxml=test-results.xml
      - name: Check database constraints directly
        env:
          PGPASSWORD: clinic
        run: psql -h 127.0.0.1 -U clinic -d clinic_test -v ON_ERROR_STOP=1 -f tests/database-probes.sql
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results.xml
          if-no-files-found: ignore
